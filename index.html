
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROGRES FOOD DZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f3;font-family:Arial,sans-serif;color:#183b2a}
header{background:#087b43;color:white;padding:28px 20px;border-radius:0 0 25px 25px}
header h1{font-size:25px;margin:0 0 10px}
header p{margin:0}
main{padding:20px;max-width:550px;margin:auto}
.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 12px #0000000c}
label{display:block;margin:14px 0 7px;font-weight:bold}
select,input{width:100%;padding:13px;border:1px solid #d5e1d8;border-radius:10px;font-size:15px;background:white}
button{width:100%;padding:15px;background:#087b43;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold;margin-top:20px}
h2{font-size:19px}
footer{text-align:center;padding:25px;color:#718477;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🍽️ PROGRES FOOD DZ</h1>
<p>احجز وجبتك الجامعية بسهولة</p>
</header>
<main>
<div class="card">
<h2>📍 معلومات الحجز</h2>
<label>الولاية</label>
<input id="wilaya" placeholder="أدخل ولايتك">
<label>الجامعة</label>
<input id="university" placeholder="اسم الجامعة">
<label>نوع الوجبة</label>
<select id="meal">
<option>وجبة الغداء</option>
<option>وجبة العشاء</option>
</select>
<label>تاريخ الحجز</label>
<input id="date" type="date">
<button onclick="book()">تأكيد الحجز</button>
<p id="result"></p>
</div>
</main>
<footer>PROGRES FOOD DZ © 2026</footer>
<script>
function book(){
const w=document.getElementById('wilaya').value;
const u=document.getElementById('university').value;
const m=document.getElementById('meal').value;
const d=document.getElementById('date').value;
if(!w||!u||!d){alert('يرجى ملء جميع المعلومات');return;}
document.getElementById('result').innerText=
'تم تسجيل طلبك التجريبي بنجاح: '+m+' - '+u+' - '+d;
}
</script>
</body>
</html>
